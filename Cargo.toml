[package]
name = "requestbaby"
version = "0.1.0"
edition = "2021"
description = "CLI Postman: curl-powered, file-based, AI-native API testing"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
tempfile = "3"
rquickjs = "0.6"
md-5 = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"

[profile.release]
lto = true
strip = true
