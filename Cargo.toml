[workspace]
resolver = "2"
members = ["crates/requestbaby-core", "crates/requestbaby-cli", "crates/requestbaby-desktop"]
# 默认只构建无界面的 core + cli：CI / 服务器 / AI 沙箱无需 GPU 与窗口系统
default-members = ["crates/requestbaby-core", "crates/requestbaby-cli"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/zhizuzhefu/requestbaby"

[workspace.dependencies]
requestbaby-core = { path = "crates/requestbaby-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
notify = "6"

[profile.release]
lto = true
strip = true
