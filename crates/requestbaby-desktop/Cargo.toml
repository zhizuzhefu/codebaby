[package]
name = "requestbaby-desktop"
description = "requestbaby 桌面端：基于 GPUI Kit，读写与 CLI 相同的项目目录与运行历史"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "requestbaby-desktop"
path = "src/main.rs"

[dependencies]
requestbaby-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
notify.workspace = true
futures = "0.3"
walkdir = "2"
gpui-kit = { version = "0.10", features = ["tree-sitter", "tree-sitter-javascript"] }
