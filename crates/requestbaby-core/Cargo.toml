[package]
name = "requestbaby-core"
description = "requestbaby 核心库：配置 / 变量 / 引擎 / 脚本 / 编排 / 校验 / 导入 / 报告模型（CLI 与 Desktop 共享）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
jsonschema = { version = "0.17", default-features = false }
walkdir = "2"
rquickjs = "0.6"
md-5 = "0.10"
sha2 = "0.10"
libc = "0.2"
hmac = "0.12"
base64 = "0.22"
# HTTP 引擎：libcurl 官方 Rust binding，static-curl 静态编译进二进制
# —— 运行时零外部依赖（不 spawn curl 进程、不动态链接系统 libcurl / OpenSSL）
# TLS 用 rustls（纯 Rust），证书校验走系统平台校验器（macOS 钥匙串 / Windows 证书库 / Linux 系统 CA），
# 签名后的 .app 在 hardened runtime 下不会因加载第三方 dylib 被拒
curl = { version = "0.4", default-features = false, features = ["static-curl", "rustls"] }
# gRPC / WebSocket 引擎：tokio 单线程运行时按次创建（与同步 runner 对接，不常驻线程）
# gRPC：tonic 传输 + prost-reflect 动态消息（不需要生成代码）；描述来源 = .proto 文件（protox 纯 Rust 编译）或服务端反射
# TLS：rustls（aws-lc，与内嵌 libcurl 共用同一套）+ 系统平台证书校验（与 libcurl 一致，钥匙串里的企业 / 自签 CA 同样生效）
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "macros"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14"
tonic-reflection = { version = "0.14", default-features = false }
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.10"
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
tokio-stream = "0.1"
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.6"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
trash = "5"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
roxmltree = "0.20"

# 跟随系统代理：读 macOS 系统设置里的 HTTP / HTTPS / SOCKS 代理与例外（与 hyper-util 同一个库）
[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.6"
# 屏幕文字识别（OCR）：进程内调用系统自带的 Vision 框架，不依赖任何外部程序或模型文件
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"
objc2-core-foundation = "0.3"

[dev-dependencies]
tempfile = "3"
