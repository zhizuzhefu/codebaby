[package]
name = "requestbaby"
description = "AI-native API testing CLI: single binary, file-based collections, scriptable, workflow-driven"
keywords = ["api", "testing", "cli", "e2e", "curl"]
categories = ["command-line-utilities", "development-tools::testing"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "requestbaby"
path = "src/main.rs"

[dependencies]
requestbaby-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
notify.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
walkdir = "2"
