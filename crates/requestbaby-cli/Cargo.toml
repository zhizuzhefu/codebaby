[package]
name = "requestbaby"
description = "Independent acceptance layer for AI-delivered code: file-based HTTP / gRPC / WebSocket cases that help humans accept AI work"
keywords = ["api", "testing", "cli", "e2e", "curl"]
categories = ["command-line-utilities", "development-tools::testing"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "requestbaby"
path = "src/main.rs"

[dependencies]
requestbaby-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
notify.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
