[package]
name = "requestbaby"
description = "Independent acceptance layer for AI-delivered work: JSON test cases for HTTP / gRPC / WebSocket APIs and Web / Android UIs, with step-by-step screenshot evidence"
keywords = ["api-testing", "e2e", "grpc", "websocket", "acceptance"]
categories = ["command-line-utilities", "development-tools::testing"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "requestbaby"
path = "src/main.rs"

[dependencies]
requestbaby-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
notify.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
